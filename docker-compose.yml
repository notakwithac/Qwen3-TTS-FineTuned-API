services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.tir
      args:
        INSTALL_FLASH_ATTN: "0"
    image: qwen3-tts-api:local
    env_file:
      - .env
    environment:
      DOCKER_PRELOAD_SARVAM_TRANSLATE: ${DOCKER_PRELOAD_SARVAM_TRANSLATE:-0}
      SARVAM_TRANSLATE_BACKEND: ${SARVAM_TRANSLATE_BACKEND:-openai}
      SARVAM_TRANSLATE_BASE_URL: ${SARVAM_TRANSLATE_BASE_URL:-http://sarvam-translate:8000/v1}
    ports:
      - "8000:8000"
    gpus: all
    networks:
      qwen-local:
        aliases:
          - qwen-tts-api
    volumes:
      - ./jobs:/app/jobs
      - ./logs:/app/logs
      - ./metrics:/app/metrics
      - ./runs:/app/runs
      - hf-cache:/root/.cache/huggingface
    command: ["/bin/bash", "/app/docker_start.sh"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully

  sarvam-translate:
    image: vllm/vllm-openai:latest
    profiles:
      - translate
    command:
      - --model
      - sarvamai/sarvam-translate
      - --dtype
      - bfloat16
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "${SARVAM_TRANSLATE_GPU_MEMORY_UTILIZATION:-0.85}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8001:8000"
    gpus: all
    networks:
      - qwen-local
    volumes:
      - hf-cache:/root/.cache/huggingface

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${E2E_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${E2E_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - qwen-local
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbuckets:
    image: minio/mc:latest
    networks:
      - qwen-local
    depends_on:
      minio:
        condition: service_healthy
    environment:
      E2E_ACCESS_KEY: ${E2E_ACCESS_KEY}
      E2E_SECRET_KEY: ${E2E_SECRET_KEY}
      E2E_BUCKET: ${E2E_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$E2E_ACCESS_KEY $$E2E_SECRET_KEY &&
      mc mb --ignore-existing local/$$E2E_BUCKET
      "

volumes:
  hf-cache:
  minio-data:

networks:
  qwen-local:
    name: qwen-local
    driver: bridge
