services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.tir
      args:
        INSTALL_FLASH_ATTN: "0"
    image: qwen3-tts-api:local
    env_file:
      - .env
    ports:
      - "8000:8000"
    gpus: all
    ipc: host
    networks:
      qwen-local:
        aliases:
          - qwen-tts-api
    volumes:
      - ./jobs:/app/jobs
      - ./logs:/app/logs
      - ./metrics:/app/metrics
      - ./runs:/app/runs
      - hf-cache:/root/.cache/huggingface
    command: ["/bin/bash", "/app/start_tir.sh"]
    depends_on:
      createbuckets:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${E2E_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${E2E_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - qwen-local
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  createbuckets:
    image: minio/mc:latest
    networks:
      - qwen-local
    depends_on:
      minio:
        condition: service_healthy
    environment:
      E2E_ACCESS_KEY: ${E2E_ACCESS_KEY}
      E2E_SECRET_KEY: ${E2E_SECRET_KEY}
      E2E_BUCKET: ${E2E_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$E2E_ACCESS_KEY $$E2E_SECRET_KEY &&
      mc mb --ignore-existing local/$$E2E_BUCKET
      "

volumes:
  hf-cache:
  minio-data:

networks:
  qwen-local:
    name: qwen-local
    driver: bridge
