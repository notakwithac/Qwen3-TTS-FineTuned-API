name: Docker Auto-Version and Publish

on:
  push:
    branches: [ "master", "docker", "sample", "PR-278" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version to publish, without leading v. Defaults to the next patch version."
        required: false
        type: string
      publish_latest:
        description: "Also publish the latest tag."
        required: false
        default: true
        type: boolean

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: "" # Docker Hub
  IMAGE_NAME: technocarsh/qwen3-tts-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push git tags after Docker publish succeeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for tagging logic

      - name: Calculate Docker tags
        id: get_version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
          PUBLISH_LATEST: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_latest == 'true' }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            NEXT_VERSION="${REQUESTED_VERSION#v}"
          else
            # Get the latest strict semver tag matching vX.Y.Z.
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 | sed 's/^v//')

            if [ -z "$LATEST_TAG" ]; then
              # Starting version as requested by user
              NEXT_VERSION="0.1.0"
            else
              # Split version into components
              IFS='.' read -r major minor patch <<< "$LATEST_TAG"

              # Simple increment logic (e.g., 0.1.0 -> 0.1.1)
              # This follows the "and so on" request by incrementing the patch number
              NEXT_VERSION="$major.$minor.$((patch + 1))"
            fi
          fi

          if ! echo "$NEXT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must use X.Y.Z format, with no leading v: $NEXT_VERSION" >&2
            exit 1
          fi

          if git rev-parse "v$NEXT_VERSION" >/dev/null 2>&1; then
            echo "Git tag v$NEXT_VERSION already exists." >&2
            exit 1
          fi

          {
            echo "tags<<EOF"
            if [ "$PUBLISH_LATEST" = "true" ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "${IMAGE_NAME}:v$NEXT_VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Docker tags:"
          if [ "$PUBLISH_LATEST" = "true" ]; then
            echo "- ${IMAGE_NAME}:latest"
          fi
          echo "- ${IMAGE_NAME}:v$NEXT_VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.tir
          push: true
          tags: ${{ steps.get_version.outputs.tags }}

      - name: Create and push Git Tag
        run: |
          # Set up git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push tag to GitHub only after the Docker image is published.
          git tag v${{ steps.get_version.outputs.version }}
          git push origin v${{ steps.get_version.outputs.version }}
